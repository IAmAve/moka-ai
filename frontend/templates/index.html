<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moka AI</title>
    <link rel="icon" href="/static/img/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/static/img/moka-logo.jpg">
    <meta name="description" content="Project MOKA — AI companion with voice, memory, and skills">
    <meta property="og:image" content="/static/img/moka-logo.jpg">
    <meta property="og:title" content="Project MOKA">
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
</head>
<body>

<div id="app">

    <!-- Icon Rail -->
    <nav id="icon-rail">
        <!-- Order: Chat → Voice → Memory → Skills → Tasks → Resources → Learning → History → Settings(bottom) -->
        <button class="rail-icon active" data-panel="chat" title="Chat">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
        </button>
        <button class="rail-icon" data-panel="voice" title="Voice">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 14a3 3 0 003 3V21h-6v-4a3 3 0 003-3z"/><path d="M19 11a7 7 0 00-14 0"/></svg>
        </button>
        <button class="rail-icon" data-panel="memory" title="Memory">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>
        </button>
        <button class="rail-icon" data-panel="skills" title="Skills">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
        </button>
        <button class="rail-icon" data-panel="tasks" title="Tasks">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/></svg>
        </button>
        <button class="rail-icon" data-panel="resources" title="Resources">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="12" width="4" height="8" rx="1"/><rect x="10" y="8" width="4" height="12" rx="1"/><rect x="17" y="4" width="4" height="16" rx="1"/></svg>
        </button>
        <button class="rail-icon" data-panel="learning" title="Learning">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 3v18h18"/><path d="M7 16l4-4 4 2 5-6"/></svg>
        </button>
        <button class="rail-icon" data-panel="history" title="History">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 6v6l4 2"/></svg>
        </button>
        <!-- Spacer pushes Settings to bottom -->
        <div style="flex:1"></div>
        <button class="rail-icon" data-panel="settings" title="Settings">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/></svg>
        </button>
    </nav>

    <!-- Panel Area -->
    <main id="panel-area">

        <!-- Chat panel (active — first in rail) -->
        <section class="panel active" id="panel-chat" data-panel="chat">
            <div class="panel-header">
                <h2>Chat</h2>
                <div class="orb-mini"><canvas id="orb-chat" width="36" height="36"></canvas></div>
            </div>
            <div class="conversation-list" id="chat-history-list"></div>
            <div class="chat-input-area">
                <div class="chat-messages" id="chat-messages"></div>
                <div class="input-row">
                    <input type="text" id="chat-input" class="input" placeholder="Ask anything…" />
                    <button id="chat-send" class="btn-send">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/></svg>
                    </button>
                </div>
            </div>
        </section>

        <!-- Voice panel -->
        <section class="panel" id="panel-voice" data-panel="voice">
            <div class="panel-header"><h2>Voice</h2></div>
            <div class="voice-orb-area">
                <canvas id="orb-voice" width="160" height="160"></canvas>
                <p class="orb-state-label" id="voice-state-label">Ready</p>
            </div>
            <div class="voice-transcript" id="voice-transcript"></div>
            <div class="voice-controls">
                <button id="voice-push" class="btn-voice">Hold to Speak</button>
            </div>
        </section>

        <!-- Memory panel -->
        <section class="panel" id="panel-memory" data-panel="memory">
            <div class="panel-header"><h2>Memory</h2></div>
            <div class="memory-content" id="memory-content">
                <div class="empty-state">Your memories will appear here.</div>
            </div>
        </section>

        <!-- Skills panel -->
        <section class="panel" id="panel-skills" data-panel="skills">
            <div class="panel-header"><h2>Skills</h2></div>
            <div class="skills-grid" id="skills-grid"></div>
        </section>

        <!-- Tasks panel -->
        <section class="panel" id="panel-tasks" data-panel="tasks">
            <div class="panel-header"><h2>Tasks</h2></div>
            <div class="tasks-list" id="tasks-list"></div>
        </section>

        <!-- Resources panel -->
        <section class="panel" id="panel-resources" data-panel="resources">
            <div class="panel-header"><h2>Resources</h2></div>
            <div class="resources-content" id="resources-content"></div>
        </section>

        <!-- Learning panel -->
        <section class="panel" id="panel-learning" data-panel="learning">
            <div class="panel-header"><h2>Learning</h2></div>
            <div class="learning-content" id="learning-content"></div>
        </section>

        <!-- History panel -->
        <section class="panel" id="panel-history" data-panel="history">
            <div class="panel-header"><h2>Activity History</h2></div>
            <div class="filter-row" id="history-filters">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="chat">Chat</button>
                <button class="filter-btn" data-filter="voice">Voice</button>
                <button class="filter-btn" data-filter="skill">Skills</button>
                <button class="filter-btn" data-filter="task">Tasks</button>
            </div>
            <div class="activity-list" id="activity-list"></div>
        </section>

        <!-- Settings panel -->
        <section class="panel" id="panel-settings" data-panel="settings">
            <div class="panel-header"><h2>Settings</h2></div>
            <div class="settings-form" id="settings-form">
                <div class="settings-group">
                    <h3>Voice</h3>
                    <label class="field-row">Wake word<input type="text" id="setting-wake-word" class="input" value="Hey Moka" /></label>
                    <label class="field-row">Microphone<select id="setting-mic" class="input"></select></label>
                    <label class="field-row">TTS Voice<select id="setting-tts" class="input"></select></label>
                </div>
                <div class="settings-group">
                    <h3>Data</h3>
                    <button class="btn-ghost" id="btn-clear-history">Clear History</button>
                    <button class="btn-ghost" id="btn-export-memory">Export Memory</button>
                </div>
                <div class="settings-group">
                    <h3>About</h3>
                    <p id="app-version" class="text-secondary">Moka AI — loading…</p>
                </div>
            </div>
        </section>

    </main>
</div>

<script src="/static/js/orb.js"></script>
<script src="/static/js/app.js"></script>
</body>
</html>
