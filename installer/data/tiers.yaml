# Model tier definitions for Moka AI installer
# All models downloaded from GitHub Releases (IAmAve/moka-ai-models)
# as GGUF files — loaded directly by llama.cpp (no Ollama, no cloud).
#
# BASE MODELS: DeepSeek Coder and Qwen Coder — specialized for coding,
# reasoning, and instruction following. All use Q4_K_M quantization
# (good quality / VRAM balance). XTTS v2 for voice (embedded offline).
#
# ⚠️  Upload these exact GGUF filenames to your GitHub release asset:
#
#   Tier 4GB   → codeqwen1.5-1_5b-q4_k_m.gguf     (~1.3 GB)
#   Tier 8GB   → deepseek-coder-7b-q4_k_m.gguf    (~4.1 GB)
#   Tier 12GB  → deepseek-coder-7b-q4_k_m.gguf    (~4.1 GB) [same file as tier 8]
#   Tier 16GB  → deepseek-coder-7b-q5_k_m.gguf    (~5.1 GB)
#   Tier 24GB  → deepseek-coder-33b-q4_k_m.gguf   (~18 GB)
#   Voice      → xttsv2-female.tar.gz              (~400 MB, already uploaded)
#
# DeepSeek Coder: trained on 60% code / 40% natural language — best-in-class
# for actual code generation, debugging, and explaining code.
# Qwen Coder: strong multilingual coding, good for Tagalog-English mixed code comments.
# Both support instruction following for the companion's mentoring behavior.

tiers:
  4:
    base:
      name: "codeqwen1.5-1.5b"
      github_asset: "codeqwen1.5-1_5b-q4_k_m.gguf"
      github_tag: "v1.0"
      size_gb: 1.3
