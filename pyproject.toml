[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "moka-ai"
version = "0.1.0"
description = "Moka AI — local AI companion with adaptive learning"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Moka AI", email = "moka@example.com"}
]
keywords = ["ai", "companion", "local-ai", "mentor"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Home Automation :: AI",
]

dependencies = [
    "flask>=3.0",
    "flask-socketio>=5.0",
    "eventlet>=0.35",
    "psutil>=5.9",
    "pyyaml>=6.0",
    "deepeval>=0.21",
    "torch>=2.0",
    "transformers>=4.30",
    "diffusers>=0.27",
    "sentencepiece>=0.1",
    "platformdirs>=4.0",
    "huggingface-hub>=0.19",
    "rich>=13.0",
    "click>=8.0",
]

[project.optional-dependencies]
all = [
    "dearpygui>=1.90",
    "numpy>=1.24",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "requests>=2.31",
]

[project.scripts]
moka = "main:main"

[tool.setuptools.packages.find]
where = ["."]
include = [
    "core*",
    "core_runtime*",
    "personality*",
    "learning*",
    "memory*",
    "plugins*",
    "safety*",
    "voice*",
    "localization*",
]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.json", "*.j2", "*.html", "*.css", "*.js"]